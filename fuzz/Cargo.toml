# Fuzz targets for every parser that reads outside input. Nightly only:
#   python3 fuzz/make_seeds.py
#   cargo +nightly fuzz run -s none -a <target> -- -max_total_time=600 -rss_limit_mb=2048
# (`cargo +nightly fuzz list` names the targets.) Inputs that ever crashed
# a target live on as unit tests next to the code they broke.
[package]
name = "irrd-ng-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "LGPL-2.1-or-later"

[package.metadata]
cargo-fuzz = true

# Its own workspace: fuzzing needs nightly, the main build does not.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
auth = { path = "../crates/auth" }
config = { path = "../crates/config" }
graphql = { path = "../crates/graphql" }
http = { path = "../crates/http" }
nrtm = { path = "../crates/nrtm" }
query = { path = "../crates/query" }
replication = { path = "../crates/replication" }
rpki = { path = "../crates/rpki" }
rpsl = { path = "../crates/rpsl" }
store = { path = "../crates/store" }
uuid = { version = "1.29.0", features = ["v4"] }

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "rpsl_parse"
path = "fuzz_targets/rpsl_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "whois_query"
path = "fuzz_targets/whois_query.rs"
