name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Baseline pin
        run: parity/check-baseline.sh
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --no-tests=warn
      - run: cargo test --doc --workspace
      - run: cargo deny check

  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, zig_target: x86_64-unknown-linux-musl, static: true }
          - { target: aarch64-unknown-linux-musl, zig_target: aarch64-unknown-linux-musl, static: true }
          - { target: x86_64-unknown-linux-gnu, zig_target: x86_64-unknown-linux-gnu.2.36, static: false }
          - { target: aarch64-unknown-linux-gnu, zig_target: aarch64-unknown-linux-gnu.2.36, static: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild@0.24.0
      - run: cargo zigbuild --release --locked --target ${{ matrix.zig_target }}
      - name: Check linkage
        run: |
          bin=target/${{ matrix.target }}/release/irrd-ng
          file "$bin"
          if [ "${{ matrix.static }}" = true ]; then
            file "$bin" | grep -q 'statically linked' || { echo "::error::$bin is not statically linked"; exit 1; }
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: irrd-ng-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/irrd-ng
          retention-days: 14
