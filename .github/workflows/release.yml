name: release

# Builds the release artefacts for a version tag and attaches them to a
# draft GitHub release, which a maintainer reviews and publishes by hand:
# the four binary tarballs, and Debian packages for amd64 and arm64 built
# from the static musl binaries, which are checked with lintian and
# install-tested on Debian 12 and 13 and Ubuntu 22.04 and 24.04 first.
# Publishing the release runs apt.yml, which adds the packages to the APT
# repository. The tag must match the workspace version in Cargo.toml
# (v1.2.3 for version = "1.2.3").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Pinned images and tools for the package checks. The Debian image is
  # also where lintian runs; dist/debian/apt-pinned.sh installs exactly
  # these versions, from snapshot.debian.org once the mirror moves on.
  DEBIAN_IMAGE: debian:13@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
  DEBIAN_SNAPSHOT: 20261101T000000Z
  LINTIAN_VERSION: 2.122.0

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, zig_target: x86_64-unknown-linux-musl, static: true, deb_arch: amd64 }
          - { target: aarch64-unknown-linux-musl, zig_target: aarch64-unknown-linux-musl, static: true, deb_arch: arm64 }
          - { target: x86_64-unknown-linux-gnu, zig_target: x86_64-unknown-linux-gnu.2.36, static: false, deb_arch: "" }
          - { target: aarch64-unknown-linux-gnu, zig_target: aarch64-unknown-linux-gnu.2.36, static: false, deb_arch: "" }
    steps:
      # Without the v4 submodule: the release is built the way a source
      # tarball is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Tag matches the workspace version
        id: version
        run: |
          tag=${GITHUB_REF_NAME}
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match the workspace version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild@0.24.0
      # No build cache: a release is built from a clean slate.
      - run: cargo zigbuild --release --locked --target ${{ matrix.zig_target }}
      - name: Check linkage
        run: |
          bin=target/${{ matrix.target }}/release/irrd-ng
          file "$bin"
          if [ "${{ matrix.static }}" = true ]; then
            file "$bin" | grep -q 'statically linked' || { echo "::error::$bin is not statically linked"; exit 1; }
          else
            file "$bin" | grep -q 'dynamically linked' || { echo "::error::$bin is not dynamically linked"; exit 1; }
          fi
      - name: Package
        run: dist/package.sh ${{ matrix.target }} ${{ steps.version.outputs.version }} dist/out
      - name: Smoke test the package
        if: startsWith(matrix.target, 'x86_64-')
        run: |
          dir=$(mktemp -d)
          tar -xzf dist/out/*.tar.gz -C "$dir"
          pkg=$(echo "$dir"/irrd-ng-*)
          test -x "$pkg/bin/irrd-ng"
          test "$(find "$pkg/bin" -type l | wc -l)" -eq 12
          # Dispatch on argv[0] through a symlink.
          "$pkg/bin/irrd" --help > /dev/null
          "$pkg/bin/irrd_load_database" --help > /dev/null
          tar -tzvf dist/out/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/out/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      # One package per architecture, from the static build, for every
      # Debian and Ubuntu release.
      - name: Debian package
        if: matrix.static
        run: |
          dist/debian/build-deb.sh target/${{ matrix.target }}/release/irrd-ng \
            ${{ matrix.deb_arch }} ${{ steps.version.outputs.version }} dist/deb
          dpkg-deb --info dist/deb/*.deb
          dpkg-deb --contents dist/deb/*.deb
      - if: matrix.static
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.deb_arch }}
          path: dist/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  lintian:
    name: lintian
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true
      - name: lintian
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/debs:/debs:ro" "$DEBIAN_IMAGE" sh -c '
            sh /src/dist/debian/apt-pinned.sh "$1" "lintian=$2" &&
            useradd --create-home lint &&
            su lint -c "lintian --fail-on error,warning --display-info /debs/*.deb"' \
            sh "$DEBIAN_SNAPSHOT" "$LINTIAN_VERSION"

  install-test:
    name: install ${{ matrix.os.name }} ${{ matrix.arch }}
    needs: build
    # arm64 on GitHub's native arm64 runners: QEMU user emulation lacks
    # system calls the store needs, so it cannot test a loaded store.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        os:
          - { name: debian-12, image: "debian:12@sha256:d74df7598108a173a621eda4d58a2adbf850b2d9a9d81bc2cca1a6c21174a880" }
          - { name: debian-13, image: "debian:13@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1" }
          - { name: ubuntu-22.04, image: "ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11" }
          - { name: ubuntu-24.04, image: "ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: debs
      # install, the v4 and not-imported guards, start, upgrade, remove and
      # purge; see the script for what each step checks.
      - name: Install test
        run: |
          deb=$(basename debs/*.deb)
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD:/src:ro" -v "$PWD/debs:/debs:ro" "${{ matrix.os.image }}" \
            bash /src/dist/debian/install-test.sh "/debs/$deb"

  publish:
    name: draft release
    needs: [build, lintian, install-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: |
          sha256sum -- *.tar.gz *.deb > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=${GITHUB_REF_NAME}
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::a release for $tag already exists; delete it or push a new tag"
            exit 1
          fi
          gh release create "$tag" --draft --verify-tag --title "irrd-ng ${tag#v}" --generate-notes \
            out/*.tar.gz out/*.deb out/SHA256SUMS
