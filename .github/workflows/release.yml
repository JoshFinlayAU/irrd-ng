name: release

# Builds the release artefacts for a version tag and attaches them to a
# draft GitHub release, which a maintainer reviews and publishes by hand.
# The tag must match the workspace version in Cargo.toml (v1.2.3 for
# version = "1.2.3").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, zig_target: x86_64-unknown-linux-musl, static: true }
          - { target: aarch64-unknown-linux-musl, zig_target: aarch64-unknown-linux-musl, static: true }
          - { target: x86_64-unknown-linux-gnu, zig_target: x86_64-unknown-linux-gnu.2.36, static: false }
          - { target: aarch64-unknown-linux-gnu, zig_target: aarch64-unknown-linux-gnu.2.36, static: false }
    steps:
      # Without the v4 submodule: the release is built the way a source
      # tarball is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Tag matches the workspace version
        id: version
        run: |
          tag=${GITHUB_REF_NAME}
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match the workspace version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild@0.24.0
      # No build cache: a release is built from a clean slate.
      - run: cargo zigbuild --release --locked --target ${{ matrix.zig_target }}
      - name: Check linkage
        run: |
          bin=target/${{ matrix.target }}/release/irrd-ng
          file "$bin"
          if [ "${{ matrix.static }}" = true ]; then
            file "$bin" | grep -q 'statically linked' || { echo "::error::$bin is not statically linked"; exit 1; }
          else
            file "$bin" | grep -q 'dynamically linked' || { echo "::error::$bin is not dynamically linked"; exit 1; }
          fi
      - name: Package
        run: dist/package.sh ${{ matrix.target }} ${{ steps.version.outputs.version }} dist/out
      - name: Smoke test the package
        if: startsWith(matrix.target, 'x86_64-')
        run: |
          dir=$(mktemp -d)
          tar -xzf dist/out/*.tar.gz -C "$dir"
          pkg=$(echo "$dir"/irrd-ng-*)
          test -x "$pkg/bin/irrd-ng"
          test "$(find "$pkg/bin" -type l | wc -l)" -eq 12
          # Dispatch on argv[0] through a symlink.
          "$pkg/bin/irrd" --help > /dev/null
          "$pkg/bin/irrd_load_database" --help > /dev/null
          tar -tzvf dist/out/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/out/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=${GITHUB_REF_NAME}
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::a release for $tag already exists; delete it or push a new tag"
            exit 1
          fi
          gh release create "$tag" --draft --verify-tag --title "irrd-ng ${tag#v}" --generate-notes \
            out/*.tar.gz out/SHA256SUMS
