[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/JoshFinlayAU/irrd-ng"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
heed = { version = "0.23.1", default-features = false, features = ["longer-keys"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
mimalloc = { version = "0.1.52", default-features = false }
num-bigint = { version = "0.5.1", default-features = false, features = ["std"] }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
# Pure-Rust PostgreSQL client for the v4 import, so it works in the static
# musl build. TLS through rustls with the ring provider (no aws-lc, no cmake).
postgres = { version = "0.19.14", default-features = false, features = ["with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", default-features = false, features = ["std"] }
webpki-roots = "1.0.11"
p256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "pkcs8", "std"] }
# Mirroring client: HTTP(S) with rustls (ring provider, Mozilla roots built
# in, like v4's certifi bundle), FTP, DNS without libc's resolver, gzip and
# the NRTMv4 hash and signature checks. All pure Rust for the static build.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "gzip", "deflate"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3.27.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
# Pure-Rust crypto so the static musl builds carry no C dependencies.
sequoia-openpgp = { version = "2.4.2", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }
hyper = { version = "1.11.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
http-body-util = "0.1.4"
httpdate = "1.0.3"
socket2 = { version = "0.6.5", features = ["all"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
unicode-general-category = "1.1.0"

rpsl = { path = "crates/rpsl" }
store = { path = "crates/store" }
query = { path = "crates/query" }
nrtm = { path = "crates/nrtm" }
http = { path = "crates/http" }
auth = { path = "crates/auth" }
rpki = { path = "crates/rpki" }
import-v4 = { path = "crates/import-v4" }
config = { path = "crates/config" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
redundant_clone = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
# A panic ends one whois connection or HTTP request, not the daemon, and
# arithmetic overflow panics instead of silently giving a wrong answer.
panic = "unwind"
overflow-checks = true
strip = "symbols"

[profile.bench]
inherits = "release"
strip = "none"
debug = "line-tables-only"
