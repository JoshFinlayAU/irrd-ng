[package]
name = "cli"
description = "The irrd-ng multicall binary: irrd, irrdctl and the irrd_* tools, dispatched on argv[0]."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "irrd-ng"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
auth.workspace = true
config.workspace = true
http = { path = "../http" }
query.workspace = true
reqwest.workspace = true
socket2.workspace = true
tokio.workspace = true
import-v4.workspace = true
mail.workspace = true
mimalloc.workspace = true
nrtm.workspace = true
rpki.workspace = true
rpsl.workspace = true
store.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
replication.workspace = true
serde_json.workspace = true
nix = { version = "0.31.3", features = ["user", "process", "fs", "signal", "resource"] }

[dev-dependencies]
tempfile.workspace = true
query = { workspace = true, features = ["fault-injection"] }
uuid.workspace = true

[lints]
workspace = true
