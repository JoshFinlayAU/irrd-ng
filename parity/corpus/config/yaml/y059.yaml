irrd:
  database_url: postgresql://irrd@localhost/irrd
  redis_url: redis://localhost
  piddir: /tmp
  server:
    http:
      url: https://irrd.example.net/
  email:
    from: irrd@example.net
    smtp: localhost
  auth:
    gnupg_keyring: /tmp/gnupg
  rpki:
    ra_source: null
  access_lists:
    ranges:
    - 10.0.0.0-10.0.0.255
    - 10.0.0.0-10.0.0.254
    - 10.0.0.5-10.0.0.1
    - ::1-::2    - 1-2-3
    - 10.0.0.1-10.0.0.2
    - '10.0.0.0-2001:db8::'
