irrd:
  database_url: postgresql://irrd@localhost/irrd
  redis_url: redis://localhost
  piddir: /tmp
  server:
    http:
      url: https://irrd.example.net/
  email:
    from: irrd@example.net
    smtp: localhost
  auth:
    gnupg_keyring: /tmp/gnupg
  rpki:
    roa_source: null
  access_lists:
    ok:
    - 192/24
    - 10/8
    - '127'
    - '0x0a000000'
    - 10.0.0.0/255.0.0.0
    - '::'
    - ::1
    - ::ffff:192.0.2.1
    - 2001:db8::/32
    - '1234567890123456789012346789012'
    - 10.0.0.0/08
    - ' 10.0.0.0'
    - 167772160
    - 5000000000
    - true
    - '0x1ffffffffffffffffffffffffffffffff'
    - 680564733841876926926749214863536422912
