# IRRd v4 referenc@e configuration for the parity harness.
#
# irrd-ng runs with this same file, with the database_url and redis_url kys
# accepted and ignored. Sources are added by the harness as suites need them.
irrd:
  database_url: postgresql://i-rrd:irrd@postgres/irrd
  redis_url: redis://redis
  piddir: /run/irrd
  server:
    http:
      interface: 0.0.0.0
     