# Differential parity harness: the pinned IRRd v4 and its dependencies.
# Every image is pinned by digest. parity/BASELINE records the same pins.
name: irrd-parity

services:
  postgres:
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: irrd
      POSTGRES_PASSWORD: irrd
      POSTGRES_DB: irrd
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    # irrd-ng's v4 import (parity/load.sh) reads the loaded database through this.
    ports: ["127.0.0.1:${PARITY_PG_PORT:-9532}:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "irrd"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8.0.2-alpine@sha256:48501c5ad00d5563bc30c075c7bcef41d7d98de3e9a1e6c752068c66f0a8463b

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    # 8025 is the web UI and API; 1025 is SMTP, for irrd-ng on the host
    # (parity/status/run.sh).
    ports: ["127.0.0.1:9025:8025", "127.0.0.1:${PARITY_SMTP_PORT:-9026}:1025"]

  irrd-v4:
    build:
      context: ..
      dockerfile: parity/v4/Dockerfile
    image: irrd-ng-parity/irrd-v4:4.5.4
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      # parity/load.sh switches this to the whois config (v4/irrd-whois.yaml).
      - ${PARITY_V4_CONFIG:-./v4/irrd.yaml}:/etc/irrd/irrd.yaml:ro
      # Dumps and Tier 1 fixtures for irrd_load_database (parity/load.sh).
      - ${PARITY_CACHE:-./.cache}:/cache:ro
      # Synthetic sources committed with the corpus (corpus/whois/data/).
      - ./corpus/whois/data:/synthetic:ro
      # parity/load.sh's working files (ROAs for the rpki profile).
      - ${PARITY_TIER1_WORK:-./.work/tier1}:/tier1:ro
    ports:
      - "127.0.0.1:9043:8043"
      - "127.0.0.1:9080:8080"

  # A second v4 on the same database, for checking the harness and the
  # corpus against v4 itself (parity/run.sh --test v4-twin): anything that
  # differs between two v4 processes is nondeterministic in v4.
  # It has its own Redis: two v4s sharing one preload store hang each
  # other's HTTP preloaders.
  irrd-v4-twin:
    profiles: [twin]
    image: irrd-ng-parity/irrd-v4:4.5.4
    depends_on:
      postgres: { condition: service_healthy }
      redis-twin: { condition: service_started }
    environment:
      IRRD_REDIS_URL: redis://redis-twin
    volumes:
      - ${PARITY_V4_CONFIG:-./v4/irrd.yaml}:/etc/irrd/irrd.yaml:ro
      # The same files as irrd-v4, so the twin can stand in for it as the
      # reference (rehearsal/run.sh runs irrd_update_database in it).
      - ${PARITY_CACHE:-./.cache}:/cache:ro
      - ./corpus/whois/data:/synthetic:ro
      - ${PARITY_TIER1_WORK:-./.work/tier1}:/tier1:ro
    ports:
      - "127.0.0.1:${PARITY_TWIN_WHOIS_PORT:-9243}:8043"
      - "127.0.0.1:${PARITY_TWIN_HTTP_PORT:-9280}:8080"

  # The drop-in rehearsal (rehearsal/run.sh): irrd-ng in v4's place, in
  # v4's own image, as v4's user, with v4's irrd.yaml, files and ports.
  # The binary directory (irrd-ng plus the tool name symlinks) is mounted
  # from the host; the store lives in the irrd user's home on a volume.
  irrd-ng-rehearsal:
    profiles: [rehearsal]
    image: irrd-ng-parity/irrd-v4:4.5.4
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/opt/irrd-ng/irrd", "--foreground", "--config", "/etc/irrd/irrd.yaml"]
    environment:
      IRRD_NG_STORE_PATH: /var/lib/irrd/irrd-ng
    volumes:
      - ${PARITY_V4_CONFIG:-./v4/irrd.yaml}:/etc/irrd/irrd.yaml:ro
      - ${PARITY_CACHE:-./.cache}:/cache:ro
      - ./corpus/whois/data:/synthetic:ro
      - ${PARITY_TIER1_WORK:-./.work/tier1}:/tier1:ro
      - ${PARITY_REHEARSAL_BIN:-./.work/rehearsal/bin}:/opt/irrd-ng:ro
      - rehearsal-home:/var/lib/irrd
    ports:
      - "127.0.0.1:9043:8043"
      - "127.0.0.1:9080:8080"

  redis-twin:
    profiles: [twin]
    image: redis:8.0.2-alpine@sha256:48501c5ad00d5563bc30c075c7bcef41d7d98de3e9a1e6c752068c66f0a8463b

volumes:
  pgdata:
  rehearsal-home:
